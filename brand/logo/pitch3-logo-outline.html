<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PITCH3 logo — black outline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
  html, body { margin:0; padding:0; background:transparent; }
  .canvas {
    width:1200px; height:400px;
    display:flex; align-items:center; justify-content:center;
  }
  .wm {
    font-family:'Anton', sans-serif; color:#fff;
    font-size:150px; letter-spacing:2px; line-height:1;
    font-style:italic; transform:skewX(-6deg);
    text-shadow:
      -4px 0 #000, 4px 0 #000, 0 -4px #000, 0 4px #000,
      -4px -4px #000, 4px -4px #000, -4px 4px #000, 4px 4px #000;
  }
  .sky { color:#4ea8ff; }
</style>
</head>
<body>
  <div class="canvas"><div class="wm">PITCH<span class="sky">3</span></div></div>
</body>
</html>
