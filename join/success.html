<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to PITCH3 Virtual — One Last Step</title>
<meta name="description" content="Payment confirmed. Tell us about your pitcher so we can build the first program.">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="brand" aria-label="PITCH3 home"><img class="brand-logo" src="../brand/logo/pitch3-logo-black.png" alt="PITCH3"></a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="../join.html">Join Program</a></li>
      <li><a href="../in-person.html">In-Person</a></li>
      <li><a href="../about.html">About</a></li>
    </ul>
  </div>
</nav>

<section class="join-success-banner">
  <div class="wrap">
    <h1>✓ Payment confirmed.</h1>
    <p>One last step — tell us about your pitcher so we can build the first program.</p>
  </div>
</section>

<section class="join-form-wrap">
  <div class="wrap">
    <iframe
      id="tally-embed"
      data-tally-src="https://tally.so/embed/816Oex?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
      loading="lazy"
      width="100%"
      height="600"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      title="PITCH3 Virtual Program Intake"
      style="min-height: 400px;"
    ></iframe>
  </div>
</section>

<footer class="footer">
  <div class="wrap footer-inner">
    <div>© <span id="yr">2026</span> PITCH3 · Fort Lauderdale, FL</div>
    <div>
      <a href="mailto:kyle@pitch3.com">kyle@pitch3.com</a>
    </div>
  </div>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  // Pass through email and plan from Stripe redirect URL (in case Tally fields are
  // configured to pre-fill from these parameters). Harmless if they aren't.
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email') || '';
  const plan = params.get('plan') || '';
  const iframe = document.getElementById('tally-embed');
  const baseSrc = iframe.getAttribute('data-tally-src');
  const finalSrc = baseSrc
    + (email ? `&email=${encodeURIComponent(email)}` : '')
    + (plan ? `&plan=${encodeURIComponent(plan)}` : '');
  iframe.setAttribute('data-tally-src', finalSrc);

  // Listen for Tally's submission event and redirect the PARENT window to our
  // thanks page. Without this, Tally would only redirect within the iframe
  // (which looks broken because the iframe has a fixed height).
  window.addEventListener('message', function(event) {
    if (!event.data || typeof event.data !== 'string') return;
    try {
      const data = JSON.parse(event.data);
      if (data.event === 'Tally.FormSubmitted') {
        window.location.href = 'thanks.html';
      }
    } catch (e) {
      // Not a Tally message, ignore
    }
  });
</script>

<script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>

</body>
</html>
